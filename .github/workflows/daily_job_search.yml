name: Daily job search

on:
  schedule:
    # 22:00 UTC = 5:00pm US Central Daylight Time (CDT, UTC-5).
    # During Standard Time (CST, UTC-6, roughly early Nov - mid Mar) this runs
    # at 4:00pm CST instead. Adjust to "0 23 * * *" during that period if you
    # need it pinned exactly to 5pm year-round.
    - cron: "0 22 * * *"
  workflow_dispatch: {}  # allows manually triggering a run from the Actions tab

jobs:
  run-daily-search:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run daily job search
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          RAPIDAPI_KEY: ${{ secrets.RAPIDAPI_KEY }}
          ADZUNA_APP_ID: ${{ secrets.ADZUNA_APP_ID }}
          ADZUNA_APP_KEY: ${{ secrets.ADZUNA_APP_KEY }}
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          HF_DATASET_REPO: ${{ secrets.HF_DATASET_REPO }}
        run: python scripts/run_daily_job.py
